name: LLM Agent
run-name: LLM run ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The branch, tag, PR number, or SHA to checkout"
        required: false
        type: string
      prompt:
        description: "Prompt to use, overwrites the default"
        required: false
        type: string
        default: ""
      prompt-extra:
        description: "Extra prompt to concatenate"
        required: false
        type: string
        default: ""
      model:
        description: "Model size"
        type: choice
        default: "medium"
        options:
        - small
        - medium
        - large
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ${{ github.ref }}
      prompt:
        required: false
        type: string
        default: ""
      prompt-extra:
        required: false
        type: string
        default: ""
      model:
        required: false
        type: string
        default: "medium"
    secrets:
      PORTKEY_API_KEY:
        required: true

jobs:
  llm:
    runs-on: ${{ vars.RUNNER != '' && fromJSON(vars.RUNNER) || 'ubuntu-latest' }}
    permissions:
      contents: read
      checks: read
      pull-requests: read

    outputs:
      pr: ${{ steps.llm.outputs.pr }}
      comment: ${{ steps.llm.outputs.comment }}

    steps:
      - name: Prepare prompt
        run: |
          prompt_file=$(mktemp --suffix=.md)
          echo "prompt_file=$prompt_file" >> "$GITHUB_ENV"

          cat <<'EOF' > "$prompt_file"
          ${{ inputs.prompt }}
          EOF

          grep -q '[^[:space:]]' "$prompt_file" || \
          cat <<'EOF' > "$prompt_file"
          # Run a deep Labgrid analysis.

          Your review should be based on the current labgrid documentation at
          ./doc/ . Never says things you are unsure.


          You shall install pip packages to help you review, test and debug;
          a venv is already active.

          The virtual environment includes $venv_packages. Install the current
          development version with `pip install -e .`

          Do **not** review commits starting with "[TMP]", "[ADI]", "[CI]",
          they are not part of the series but to change the CI/CD or temporally change behaviour.
          EOF

          cat <<'EOF' >> "$prompt_file"
          ${{ inputs.prompt-extra }}
          EOF

      - name: Prepare tools
        shell: bash
        run: |
          py_venv="$(mktemp -d)"
          echo "py_venv=$py_venv" >> "$GITHUB_ENV"

          python3 -m venv $py_venv
          source $py_venv/bin/activate
          python3 -m ensurepip --upgrade

      - uses: analogdevicesinc/doctools/llm@action
        id: llm
        with:
          ref: ${{ inputs.ref }}
          model: ${{ inputs.model }}
          prompt-file: ${{ env.prompt_file }}
          api-key: ${{ secrets.PORTKEY_API_KEY }}
          py-venv: ${{ env.py_venv }}
          sh-source: ${{ env.sh_source }}

      - name: Clean-up
        if: always()
        run: |
          rm -f "$prompt_file"
          rm -rf "$prompt_dir"
          rm -rf "$py_venv"

  pr-comment:
    runs-on: ubuntu-slim
    needs: llm
    permissions:
      pull-requests: write

    steps:
      - uses: analogdevicesinc/doctools/gh-pr-comment@action
        with:
          pr: ${{ needs.llm.outputs.pr }}
          body: ${{ needs.llm.outputs.comment }}
